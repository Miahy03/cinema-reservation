spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.security.jwt.secret=${JWT_SECRET:dev-secret-cinema-reservation-0123456789abcdefghijklmnopqrstuv}
app.security.jwt.issuer=cinema-reservation
app.security.jwt.expiration=${JWT_EXPIRATION:3600}
